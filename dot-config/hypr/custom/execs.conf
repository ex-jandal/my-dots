# You can make apps auto-start here
# Relevant Hyprland wiki section: https://wiki.hyprland.org/Configuring/Keywords/#executing

exec-once = gsettings set org.gnome.desktop.interface font-name 'Rubik 11'
exec-once = gsettings set org.gnome.desktop.interface document-font-name 'Rubik 11'
exec-once = gsettings set org.gnome.desktop.interface monospace-font-name 'JetBrains Mono Nerd Font'
exec-once = gsettings set org.gnome.desktop.wm.preferences titlebar-font 'Rubik'

# exec-once = ~/Applications/Altaqwaa-3.0.1_a011b640677868a65ab2f48c6bc4ec3c.AppImage --hidden

# Cursor
# exec-once = hyprctl setcursor WhiteSur-cursors 24
# exec-once = hyprctl setcursor Bibata-Modern-Classic 24
exec-once = hyprctl setcursor "ComixCursors-Black" 48

exec-once = xhost +SI:localuser:root
exec-once = kdeconnect-indicator &
# exec-once = nm-applet &
exec-once = syncthingtray-qt6 --wait
exec-once = hypr-wellbeing -d &> /dev/null &
exec-once = go-pray daemon &

