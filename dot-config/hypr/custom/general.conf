# Put general config stuff here
# Here's a list of every variable: https://wiki.hyprland.org/Configuring/Variables/

monitor = HDMI-A-1, 1920x1080@60.00Hz, 0x0, auto, mirror, eDP-1
monitor = eDP-1, 1920x1080@60.00Hz, 0x0, 1
# experimental {
#   rander {
#     new_rander_scheduling = true
#   }
# }

# gesture = 4, swipe, move,
# gesture = 3, horizontal, workspace
# gesture = 3, pinch, float
# gesture = 3, up, dispatcher, global, quickshell:overviewToggle
# gesture = 3, down, dispatcher, global, quickshell:overviewClose
# gestures {
#     workspace_swipe_distance = 700
#     workspace_swipe_cancel_ratio = 0.2
#     workspace_swipe_min_speed_to_force = 5
#     workspace_swipe_direction_lock = true
#     workspace_swipe_direction_lock_threshold = 10
#     workspace_swipe_create_new = true
# }

render{
  new_render_scheduling = 1
}

# eRenderStage::RENDER_POST_WALLPAPER = 1

debug {
    overlay = false
}

input {
  kb_layout = us,ara
  kb_options = grp:win_space_toggle, caps:swapescape
}

cursor {
  no_hardware_cursors = 1
}

decoration {
  blur {
    enabled = true
    xray = true
    special = false
    new_optimizations = true
    size = 2
    passes = 2
    brightness = 1
    noise = 0.15
    contrast = 1
    vibrancy = 0.5
    vibrancy_darkness = 0.8
    popups = false
    popups_ignorealpha = 0.6
    input_methods = true
    input_methods_ignorealpha = 0.8
  }
}
